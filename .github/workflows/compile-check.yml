name: Renderer PR compile check

on:
  pull_request:
    branches: [ryty-gpu]
  workflow_dispatch:
    inputs:
      branding:
        description: Window title and icon (shadGT, or ryGT7's)
        type: choice
        options: [shadGT, RyGT7]
        default: shadGT

permissions:
  contents: read

concurrency:
  group: pr-compile-${{ github.event.pull_request.number || github.ref }}-${{ inputs.branding || 'shadGT' }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Compile Vulkan renderer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Support long submodule paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile PR merge checkout
        shell: pwsh
        env:
          SHADGT_BRANDING: ${{ inputs.branding || 'shadGT' }}
        run: ./.github/scripts/compile-renderer.ps1
